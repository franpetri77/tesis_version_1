services:
  db:
    image: mysql:8.0
    container_name: tele_import_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-teleimport2024}
      MYSQL_DATABASE: ${DB_NAME:-tele_import}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-teleimport2024}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
